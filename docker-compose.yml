services:
    mcp-server:
        build:
            context: .
            dockerfile: Dockerfile
        image: mcp/crawl4ai-rag:latest
        ports:
            - "8051:8051"
        environment:
            - TRANSPORT=sse
            - HOST=0.0.0.0
            - PORT=8051
            - OLLAMA_BASE_URL=http://192.168.1.10:11434
            - OLLAMA_MODEL=nomic-embed-text
            - MODEL_CHOICE=nomic-embed-text
            - SUPABASE_URL=http://192.168.1.10:8000
            - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
            - GITHUB_TOKEN=${GITHUB_TOKEN}
        networks:
            - app_network
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:8051/sse"]
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 60s
        restart: unless-stopped
        extra_hosts:
            - "host.docker.internal:host-gateway"
        deploy:
            resources:
                limits:
                    cpus: '2.0'
                    memory: 4G
                reservations:
                    cpus: '1.0'
                    memory: 2G
        shm_size: 2gb

    openapi-server:
        build:
            context: .
            dockerfile: Dockerfile
        image: mcp/crawl4ai-rag:latest
        command: python src/openapi_server.py
        ports:
            - "8082:8082"
        environment:
            - HOST=0.0.0.0
            - OPENAPI_PORT=8082
            - OLLAMA_BASE_URL=http://192.168.1.10:11434
            - OLLAMA_MODEL=nomic-embed-text
            - MODEL_CHOICE=nomic-embed-text
            - SUPABASE_URL=http://192.168.1.10:8000
            - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
            - GITHUB_TOKEN=${GITHUB_TOKEN}
        networks:
            - app_network
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 60s
        restart: unless-stopped
        extra_hosts:
            - "host.docker.internal:host-gateway"
        deploy:
            resources:
                limits:
                    cpus: '2.0'
                    memory: 4G
                reservations:
                    cpus: '1.0'
                    memory: 2G
        shm_size: 2gb

networks:
    app_network:
        driver: bridge
